name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    # Python 3.9 has no actions/python-versions build for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test services
        run: sudo apt-get update && sudo apt-get install -y screen openssh-sftp-server
      - run: python -m pip install -r requirements-test.txt
      - name: Python integration tests
        env:
          SCREENDESK_TEST_SCREEN: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: JavaScript mouse protocol tests
        run: |
          node tests/test_mouse.mjs
          node tests/test_terminal_view.mjs
          node tests/test_mobile.mjs
          node tests/test_sharing.mjs
          node tests/test_workspace_sync.mjs
          node tests/test_terminal_input.mjs
  macos:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify the standalone macOS app
        run: |
          checkout="$PWD"
          app_home=$(mktemp -d)
          HOME="$app_home" sh install-macos-app.sh "$checkout"
          /usr/bin/codesign --verify --strict "$app_home/Applications/ScreenDesk.app"
      - run: python -m pip install -r requirements-test.txt
      - name: macOS screen and SFTP integration tests
        env:
          SCREENDESK_TEST_SCREEN: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: JavaScript mouse protocol tests
        run: |
          node tests/test_mouse.mjs
          node tests/test_terminal_view.mjs
          node tests/test_mobile.mjs
          node tests/test_sharing.mjs
          node tests/test_workspace_sync.mjs
          node tests/test_terminal_input.mjs
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Verify Desktop and Start menu shortcuts
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ScreenDesk shortcut test'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          Copy-Item install-windows-shortcuts.cmd, install-windows-shortcuts.js, install_windows_app.py, assets -Destination $fixture -Recurse
          @'
          from pathlib import Path
          import sys
          def main():
              assert sys.stdout is None and sys.stderr is None
              Path(__file__).with_name('shortcut-launch.txt').write_text('windowed')
              return 0
          '@ | Set-Content -Encoding UTF8 (Join-Path $fixture 'windows_app.py')
          Push-Location $fixture
          try {
            foreach ($attempt in 1, 2) {
              & cmd.exe /d /c install-windows-shortcuts.cmd --quiet
              if ($LASTEXITCODE -ne 0) { throw 'Shortcut installation failed' }
            }
            $shell = New-Object -ComObject WScript.Shell
            foreach ($folder in 'DesktopDirectory', 'Programs') {
              $path = Join-Path ([Environment]::GetFolderPath($folder)) 'ScreenDesk.lnk'
              if (!(Test-Path -LiteralPath $path)) { throw "Missing shortcut at $path" }
              $link = $shell.CreateShortcut($path)
              if ($link.TargetPath -ne (Join-Path $fixture 'data\desktop\ScreenDesk.exe') -or
                  $link.WorkingDirectory -ne $fixture -or
                  ($link.IconLocation -replace ',\s*0$', '') -ne (Join-Path $fixture 'assets\ScreenDesk.ico')) {
                throw "Unexpected shortcut settings at $path"
              }
            }
            $desktop = [Environment]::GetFolderPath('DesktopDirectory')
            Start-Process -FilePath (Join-Path $desktop 'ScreenDesk.lnk') -WindowStyle Hidden
            for ($attempt = 0; $attempt -lt 50 -and !(Test-Path 'shortcut-launch.txt'); $attempt++) {
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path 'shortcut-launch.txt')) { throw 'Shortcut did not run the launcher' }
          } finally {
            Pop-Location
          }
      - name: Native Windows runtime and launcher tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Render the workspace in a real WebView2 window
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/windows_webview_smoke.py
      - name: Verify desktop and phone workspace synchronization
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/windows_workspace_sync.py
      - name: JavaScript mouse protocol tests
        run: |
          node tests/test_mouse.mjs
          node tests/test_terminal_view.mjs
          node tests/test_mobile.mjs
          node tests/test_sharing.mjs
          node tests/test_workspace_sync.mjs
          node tests/test_terminal_input.mjs
